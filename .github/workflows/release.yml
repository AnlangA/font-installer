name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Build release binary
        run: cargo build --release --verbose
        
      - name: Create release archive
        run: |
          cd target/release
          Compress-Archive -Path font-installer.exe -DestinationPath font-installer-windows-x64.zip
        shell: pwsh
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: font-installer-windows-x64
          path: target/release/font-installer-windows-x64.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: font-installer-windows-x64
          path: ./artifacts
          
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Windows Font Installer ${{ steps.get_version.outputs.VERSION }}
            
            ### Downloads
            - `font-installer-windows-x64.zip` - Windows x64 executable
            
            ### Installation
            1. Download the zip file
            2. Extract `font-installer.exe`
            3. Run with administrator privileges
            
            ### Usage
            ```
            font-installer.exe [DIRECTORY]
            ```
            
            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for more details.
          files: |
            ./artifacts/font-installer-windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
